# Phase A spike: two throwaway agents inside this repo, plus one room.
# Delete the agents and room once docs/spike-results.md is filled in.
version: 1

params:
  workspace:
    type: directory
    label: RecoverOps repo folder
    description: Absolute path to your clone of the recoverops repo
    default: /Users/atul/Desktop/atul/hackathon/recoverops
  provider:
    type: provider
    default: [claude]
    input: advanced
  location:
    type: location
    default: local
    input: advanced
  bridge:
    type: bridge
    default: [$first]
    input: advanced

agents:
  # spike-a: Auto mode OFF, so any prompt it avoids is thanks to .claude/settings.json (spike 5).
  - name: spike-a
    description: RecoverOps spike agent A (auto mode off, addressing anyone)
    addressing: anyone
    auto_mode: false
    provider: "{provider}"
    location: "{location}"
    directory: "{workspace}/agents/spike-a"
    instructions: |
      Throwaway test agent. Follow CLAUDE.md in your working folder.
      Answer only what you are asked, in one short reply, in the same thread.
  # spike-b: Auto mode ON (default) and owner-agents, so finance/sales should be ignored by it.
  - name: spike-b
    description: RecoverOps spike agent B (auto mode on, addressing owner-agents)
    addressing: owner-agents
    provider: "{provider}"
    location: "{location}"
    directory: "{workspace}/agents/spike-b"
    instructions: |
      Throwaway test agent. Follow CLAUDE.md in your working folder.
      Answer only what you are asked, in one short reply, in the same thread.

room:
  name: spike-room
  description: Phase A spikes for RecoverOps (throwaway)
  instructions: |
    Room rule for this test: start every reply with the word SPIKE.
  bridge: "{bridge}"
  agents: [spike-a, spike-b]
  users: ["{$creator}", finance, sales]

kickoff: |
  @spike-a and @spike-b: run `python3 ../../tools/hello.py <your agent name>` from your working folder and paste its JSON output. One reply each.
